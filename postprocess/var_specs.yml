  refh: 2
utci:
  <<: *defaults
  refh: 2
humidex:
  <<: *defaults
  refh: 2

# --- Hydrology / soil / snow variables (6-hourly) ---
mrro:
  <<: *defaults
  quant: '.6'
mrros:
  <<: *defaults
  quant: '.6'
mrso:
  <<: *defaults
  quant: '.1'
# mrsol has a soil depth axis (4 Noah-MP layers); levels: soil tells
# cmorize.sh to write depth/depth_bnds coordinate metadata.
mrsol:
  <<: *defaults
  levels: soil
  quant: '.1'
snw:
  <<: *defaults
  quant: '.1'
snd:
  <<: *defaults
  quant: '.3'
snm:
  <<: *defaults
  quant: '.6'

# --- Surface radiation and heat flux variables ---
# rsus, rlus (accumulated) and hfss are hourly; hfls is 6-hourly.
rsus:
  <<: *defaults
  quant: '.1'
rlus:
  <<: *defaults
  quant: '.1'
hfls:
  <<: *defaults
  quant: '.1'
hfss:
  <<: *defaults
  quant: '.1'

# --- New single-level variables (2026-10 batch) ---
# TOA radiation (hourly; rsdt/rsut accumulated, rlut instantaneous OLR)
rsdt:
