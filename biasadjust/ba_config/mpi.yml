# Bias-adjusted output for MPI-ESM1-2-HR (historical, ssp245, ssp370),
# ISIMIP3BASD calibrated on ERA5-Land 1985-2014.
#
# One config per driving model (short name: ece, mpi, era, ...).  It covers
# every experiment bias-adjusted for that model; historical is processed
# once and shared by all scenarios.  To add a scenario later, add its
# sources below and re-run ba_setup.py and ba_format.py (existing outputs
# are skipped).  Filenames differ by experiment, so all experiments share
# the flat <var>.day staging directories.

id: "mpi"

# Root of the bias-adjusted tree for this driving model.
source_root: "/lustre/desc1/p/nral0053/na-cordex-cmip6/biascorrection/isimip_basd/MPI-ESM1-2-HR"

# A setup directory from the raw postprocessing.  Provides var_table.tsv
# (refh, positive, quant) and the ncrepack-cordex scripts.  var_table is
# the same for every simulation, so all configs share this one.
raw_setupdir: "/glade/derecho/scratch/mcginnis/jacob/na-cordex/ece-370/setup"

# Bias-adjustment ID, <BCname>-<OBSname>-<REFperiod> (CORDEX-CMIP5 Adjust
# convention; no CORDEX-CMIP6 spec yet).  BCname is institution-method:
# PIK (Potsdam Institute for Climate Impact Research, which wrote ISIMIP3)
# and ISIMIP3 (bias adjustment only; the statistical downscaling part of
# ISIMIP3BASD is not used).  Appended to version_realization in the
# filename, the DRS path, and the id_attribute, e.g.
# v1-r1-PIK-ISIMIP3-ERA5Land-1985-2014.  ba_cmorize.py checks that it
# equals bc_method_id-<input bc_observation_id>-<input bc_period>.
bc_method_id: "PIK-ISIMIP3"
ba_id: "PIK-ISIMIP3-ERA5Land-1985-2014"

# Filename / metadata components.  ba_cmorize.py checks these against the
# input file attributes and stops on any mismatch.
domain_id: "NAM-12i"
driving_source_id: "MPI-ESM1-2-HR"
driving_variant_label: "r1i1p1f1"
institution_id: "NCAR"
source_id: "WRF461S-SN"
version_realization: "v1-r1"
calendar: "proleptic_gregorian"

# DRS root components (relocate_ba.sh).  drs_activity replaces DD (CORDEX-
# CMIP5 Adjust convention) and is also written to the activity_id attribute.
drs_project: "CORDEX-Adjust"
drs_activity: "bias-adjusted-output"

# Daily output file length in years; chunks end on years divisible by this
# (same rule as postprocess/aggregate.sh).
chunk_years: 5

# Which years each source directory contributes to which experiment.
# path is relative to source_root and ends at the simh-* level; every
# simf-* directory under it is scanned.  Years found in a source but not
# listed under any experiment are skipped (and recorded in the manifest).
# Every listed year must be found, and no (experiment, var, year) may come
# from more than one source.
#
# Historical years adjusted in a combined historical-ssp* run (simf window
# 2010-2039) are labeled with that scenario, not historical, and go in the
# scenario's DRS branch (CORDEX-CMIP5 Adjust convention).  So historical
# ends in 2009 and each scenario starts in 2010; with several scenarios,
# 2010-2014 appears once per scenario.
sources:
  - path: "historical_v20260618/obs-era5land_1985-2014/simh-1985-2014"
    experiments:
      historical: [1953, 2009]
  - path: "historical-ssp370_v20260618-v20260723/obs-era5land_1985-2014/simh-1985-2014"
    experiments:
      ssp370: [2010, 2039]
  - path: "historical-ssp245_v20260618-v20260626/obs-era5land_1985-2014/simh-1985-2014"
    experiments:
      ssp245: [2010, 2039]
  - path: "ssp370_v20260723/obs-era5land_1985-2014/simh-1985-2014"
    experiments:
      ssp370: [2040, 2099]
  - path: "ssp245_v20260626/obs-era5land_1985-2014/simh-1985-2014"
    experiments:
      ssp245: [2040, 2099]
